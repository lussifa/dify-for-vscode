                    id:
                      type: string
                    type:
                      enum:
                      - function
                      type: string
                  required:
                  - id
                  - type
                  - function
                  type: object
                type: array
              type:
                description: message for a normal assistant reply; tool_calls when requesting functions.
                enum:
                - message
                - tool_calls
                type: string
            required:
            - type
            - content
            - tool_calls
            type: object
