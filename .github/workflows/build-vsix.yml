name: Build and Release VSIX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate extension and runtime dependencies
        run: |
          npm run check
          node --input-type=module - <<'NODE'
          import * as client from '@modelcontextprotocol/client';
          import * as server from '@modelcontextprotocol/server';
          import * as nodeAdapter from '@modelcontextprotocol/node';
          import { chromium } from 'playwright-core';
          import { createRequire } from 'node:module';
          import fs from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';

          const require = createRequire(import.meta.url);
          const PptxGenJS = require('pptxgenjs');
          const ExcelJS = require('exceljs');
          const docx = require('docx');
          const mammoth = require('mammoth');
          const missing = [];
          if (!client.Client) missing.push('@modelcontextprotocol/client.Client');
          if (!client.StreamableHTTPClientTransport) missing.push('@modelcontextprotocol/client.StreamableHTTPClientTransport');
          if (!server.McpServer) missing.push('@modelcontextprotocol/server.McpServer');
          if (!server.createMcpHandler) missing.push('@modelcontextprotocol/server.createMcpHandler');
          if (!nodeAdapter.toNodeHandler) missing.push('@modelcontextprotocol/node.toNodeHandler');
          if (!chromium) missing.push('playwright-core.chromium');
          if (!PptxGenJS) missing.push('pptxgenjs');
          if (!ExcelJS.Workbook) missing.push('exceljs.Workbook');
          if (!docx.Document || !docx.Packer) missing.push('docx.Document/Packer');
          if (!mammoth.extractRawText) missing.push('mammoth.extractRawText');
          if (missing.length) {
            console.error('Missing runtime exports:', missing.join(', '));
            process.exit(1);
          }

          // Context Manager: preserve the current task/tool cycle while compacting older tasks.
          const context = require('./contextManager');
          const huge = 'x'.repeat(30000);
          const history = [
            { role: 'user', content: 'Task one: organize files' },
            { role: 'assistant', content: null, tool_calls: [{ id: 'call_old', name: 'list_files', arguments: {} }] },
            { role: 'tool', tool_call_id: 'call_old', name: 'list_files', content: huge },
            { role: 'assistant', content: 'Task one completed. Generated reports/manifest.xlsx.' },
            { role: 'user', content: 'Task two: inspect the workbook' },
            { role: 'assistant', content: null, tool_calls: [{ id: 'call_mid', name: 'excel_inspect', arguments: { path: 'reports/manifest.xlsx' } }] },
            { role: 'tool', tool_call_id: 'call_mid', name: 'excel_inspect', content: huge },
            { role: 'assistant', content: 'Workbook inspection completed.' },
            { role: 'user', content: 'Task three: build a presentation from it' },
            { role: 'assistant', content: null, tool_calls: [{ id: 'call_now', name: 'ppt_create', arguments: { output_path: 'reports/deck.pptx' } }] },
            { role: 'tool', tool_call_id: 'call_now', name: 'ppt_create', content: huge }
          ];
          const prepared = context.prepareContext(history, {
            enabled: true,
            recentTasks: 2,
            maxChars: 20000,
            toolResultMaxChars: 1200,
            storedToolResultMaxChars: 1000,
            summaryMaxChars: 3000
          });
          if (!(prepared.stats.outboundChars < prepared.stats.originalChars)) throw new Error('Context Manager did not reduce outbound context.');
          if (!prepared.messages.some(m => m.role === 'system' && String(m.content).includes('previous task summaries'))) throw new Error('Context Manager did not summarize the oldest task.');
          if (!prepared.messages.some(m => m.role === 'user' && String(m.content).includes('Task three'))) throw new Error('Context Manager lost the current user task.');
          if (!prepared.messages.some(m => m.role === 'assistant' && Array.isArray(m.tool_calls) && m.tool_calls.some(c => c.id === 'call_now'))) throw new Error('Context Manager lost the current tool call.');
          if (!prepared.messages.some(m => m.role === 'tool' && m.tool_call_id === 'call_now')) throw new Error('Context Manager lost the current tool result.');

          const tmp = await fs.mkdtemp(path.join(os.tmpdir(), 'dify-office-smoke-'));

          // Low-level dependency smoke tests.
          const pptPath = path.join(tmp, 'library-smoke.pptx');
          const ppt = new PptxGenJS();
          ppt.layout = 'LAYOUT_WIDE';
          ppt.addSlide().addText('Office smoke test', { x: 1, y: 1, w: 5, h: 1 });
          await ppt.writeFile({ fileName: pptPath });

          const xlsxPath = path.join(tmp, 'library-smoke.xlsx');
          const workbook = new ExcelJS.Workbook();
          const ws = workbook.addWorksheet('Data');
          ws.addRow(['Name', 'Value']);
          ws.addRow(['Smoke', 1]);
          await workbook.xlsx.writeFile(xlsxPath);
          const reread = new ExcelJS.Workbook();
          await reread.xlsx.readFile(xlsxPath);
          if (reread.getWorksheet('Data').getCell('B2').value !== 1) throw new Error('Excel round-trip smoke test failed.');

          const docxPath = path.join(tmp, 'library-smoke.docx');
          const document = new docx.Document({ sections: [{ children: [new docx.Paragraph({ children: [new docx.TextRun('Office smoke test')] })] }] });
          await fs.writeFile(docxPath, await docx.Packer.toBuffer(document));
          const raw = await mammoth.extractRawText({ path: docxPath });
          if (!String(raw.value || '').includes('Office smoke test')) throw new Error('Word round-trip smoke test failed.');

          // Exercise our actual Office subsystem with a minimal VS Code workspace mock.
          const Module = require('node:module');
          const originalLoad = Module._load;
          Module._load = function(request, parent, isMain) {
            if (request === 'vscode') {
              return { workspace: { workspaceFolders: [{ uri: { scheme: 'file', fsPath: tmp } }] } };
            }
            return originalLoad.call(this, request, parent, isMain);
          };

          const { executeOfficeTool, OFFICE_TOOLS } = require('./office');
          if (!Array.isArray(OFFICE_TOOLS) || OFFICE_TOOLS.length !== 13) throw new Error(`Expected 13 Office tools, got ${OFFICE_TOOLS?.length}`);

          const pptCreate = await executeOfficeTool('ppt_create', {
            output_path: 'native-designed.pptx',
            title: 'AI Office Automation',
            theme: 'consulting',
            design_mode: 'polished',
            slides: [
              { type: 'title', title: 'AI Office Automation', subtitle: 'From repetitive work to agent workflows', eyebrow: 'INTERNAL TRAINING' },
              { type: 'hero_number', title: 'The opportunity', metric_value: '73%', metric_label: 'of repetitive office handling can be streamlined', metric_detail: 'File organization, consolidation and reporting are ideal agent workflows.' },
              { type: 'kpi_cards', title: 'What improves', metrics: [{ value: '4.6h', label: 'Time saved', detail: 'per employee each week' }, { value: '6x', label: 'Faster', detail: 'routine consolidation' }, { value: '1', label: 'Workflow', detail: 'from input to deliverable' }] },
              { type: 'process', title: 'Agent workflow', steps: [{ title: 'Collect', text: 'Read source files' }, { title: 'Analyze', text: 'Understand structure' }, { title: 'Execute', text: 'Transform content' }, { title: 'Verify', text: 'Review outputs' }] },
              { type: 'comparison', title: 'Before and after', left_title: 'Manual', left_text: 'Repeated copy/paste and checking', left_bullets: ['Slow handoffs', 'Inconsistent naming'], right_title: 'Agent', right_text: 'One instruction coordinates the workflow', right_bullets: ['Repeatable process', 'Auditable outputs'] },
              { type: 'data_story', title: 'The business case', metric_value: '28%', metric_label: 'less administrative effort', metric_detail: 'Shift capacity from routine handling to higher-value work.', metrics: [{ value: '20', label: 'Files', detail: 'organized automatically' }, { value: '6', label: 'Departments', detail: 'consolidated together' }] },
              { type: 'chart_insight', title: 'Where time is saved', chart: { type: 'column', categories: ['Collect', 'Rename', 'Consolidate', 'Report'], series: [{ name: 'Minutes saved', values: [18, 24, 42, 31] }] }, takeaway: 'Consolidation creates the largest single saving.', subtitle: 'Focus automation on repeated cross-file transformations.' },
              { type: 'closing', eyebrow: 'NEXT STEP', statement: 'Start with one repetitive workflow. Make it repeatable.', subtitle: 'Then expand the same agent platform to adjacent office work.' }
            ]
          });
          if (!pptCreate.success || pptCreate.slide_count !== 8) throw new Error(`ppt_create failed: ${JSON.stringify(pptCreate)}`);
          if (!Number.isFinite(pptCreate.design_score) || pptCreate.design_score < 80) throw new Error(`Designed PPT scored too low: ${JSON.stringify(pptCreate.design_review)}`);
          const pptReview = await executeOfficeTool('ppt_design_review', { path: 'native-designed.pptx' });
          if (!pptReview.success || pptReview.score < 80 || pptReview.archetype_count < 6) throw new Error(`ppt_design_review failed: ${JSON.stringify(pptReview)}`);
          const pptInspect = await executeOfficeTool('ppt_inspect', { path: 'native-designed.pptx' });
          if (!pptInspect.success || !pptInspect.editable || !pptInspect.slides.some(s => s.type === 'kpi_cards') || !pptInspect.slides.some(s => s.type === 'chart_insight')) throw new Error(`ppt_inspect failed: ${JSON.stringify(pptInspect)}`);
          const pptUpdate = await executeOfficeTool('ppt_update', { path: 'native-designed.pptx', action: 'set_theme', theme: 'editorial' });
          if (!pptUpdate.success || pptUpdate.theme !== 'editorial') throw new Error(`ppt_update theme failed: ${JSON.stringify(pptUpdate)}`);

          const excelCreate = await executeOfficeTool('excel_create', {
            output_path: 'native.xlsx',
            sheets: [{ name: 'Data', headers: ['Name', 'Value'], rows: [['Alpha', 1], ['Beta', { formula: '1+1', result: 2 }]], freeze_header: true, auto_filter: true }]
          });
          if (!excelCreate.success) throw new Error(`excel_create failed: ${JSON.stringify(excelCreate)}`);
          const excelWrite = await executeOfficeTool('excel_write_range', { path: 'native.xlsx', sheet: 'Data', start_cell: 'C1', values: [['Status'], ['OK'], ['OK']] });
          if (!excelWrite.success) throw new Error(`excel_write_range failed: ${JSON.stringify(excelWrite)}`);
          const excelAppend = await executeOfficeTool('excel_append_rows', { path: 'native.xlsx', sheet: 'Data', rows: [['Gamma', 3, 'OK']] });
          if (!excelAppend.success) throw new Error(`excel_append_rows failed: ${JSON.stringify(excelAppend)}`);
          const excelFormat = await executeOfficeTool('excel_format_range', { path: 'native.xlsx', sheet: 'Data', range: 'A1:C1', style: { bold: true, fill_color: '2563EB', font_color: 'FFFFFF', horizontal: 'center', border: true } });
          if (!excelFormat.success) throw new Error(`excel_format_range failed: ${JSON.stringify(excelFormat)}`);
          const excelInspect = await executeOfficeTool('excel_inspect', { path: 'native.xlsx', sheet: 'Data', max_rows: 10, max_cols: 5 });
          if (!excelInspect.success || excelInspect.selected_sheet !== 'Data' || excelInspect.sample.length < 4) throw new Error(`excel_inspect failed: ${JSON.stringify(excelInspect)}`);

          const wordCreate = await executeOfficeTool('word_create', {
            output_path: 'native.docx',
            title: 'Native Word Smoke',
            blocks: [
              { type: 'heading', level: 1, text: 'Summary' },
              { type: 'paragraph', text: 'Office subsystem round-trip test.' },
              { type: 'bullets', items: ['PPT', 'Excel', 'Word'] },
              { type: 'table', table: { headers: ['Item', 'Status'], rows: [['Office', 'OK']] } }
            ]
          });
          if (!wordCreate.success) throw new Error(`word_create failed: ${JSON.stringify(wordCreate)}`);
          const wordUpdate = await executeOfficeTool('word_update', { path: 'native.docx', action: 'append_block', block: { type: 'heading', level: 2, text: 'Next' } });
          if (!wordUpdate.success) throw new Error(`word_update failed: ${JSON.stringify(wordUpdate)}`);
          const wordInspect = await executeOfficeTool('word_inspect', { path: 'native.docx', max_chars: 10000 });
          if (!wordInspect.success || !wordInspect.editable || !String(wordInspect.text).includes('Office subsystem')) throw new Error(`word_inspect failed: ${JSON.stringify(wordInspect)}`);

          for (const file of [pptPath, xlsxPath, docxPath, path.join(tmp, 'native-designed.pptx'), path.join(tmp, 'native.xlsx'), path.join(tmp, 'native.docx')]) {
            const stat = await fs.stat(file);
            if (!stat.size) throw new Error(`Generated Office file is empty: ${file}`);
          }
          console.log('Context Manager, Presentation Design Engine, runtime dependencies, and Office tools validated.');
          NODE

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=dify-for-vscode-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package --out "${{ steps.version.outputs.vsix }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-for-vscode-vsix
          path: "${{ steps.version.outputs.vsix }}"

      - name: Create GitHub Release if missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing the VSIX asset."
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" \
              --target "$GITHUB_SHA" \
              --title "Dify for VS Code $TAG" \
              --generate-notes
          fi
