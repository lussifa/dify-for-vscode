name: Build VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vsce package --out dify-for-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: dify-for-vscode-vsix
          path: dify-for-vscode.vsix
